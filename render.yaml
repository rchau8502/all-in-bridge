# Render blueprint — one-click deploy of the All-In Bridge game server.
# Free web service: pure WebSocket (ws) on the assigned $PORT.
# Free instances sleep after inactivity; the first connection after a
# nap can take ~30-60s while it wakes.
services:
  - type: web
    name: all-in-bridge-server
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:server
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
